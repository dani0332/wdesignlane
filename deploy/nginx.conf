# =============================================================
#  Web Design Lane — nginx server block
#  Goes in /etc/nginx/sites-available/ and is symlinked into
#  sites-enabled/. Unlike .htaccess this needs a reload:
#      sudo nginx -t && sudo systemctl reload nginx
# =============================================================

server {
    listen 80;
    server_name webdesignlane.com www.webdesignlane.com;
    return 301 https://www.webdesignlane.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name webdesignlane.com;
    # ssl_certificate / ssl_certificate_key here
    return 301 https://www.webdesignlane.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.webdesignlane.com;

    root /var/www/webdesignlane/dist;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/webdesignlane.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/webdesignlane.com/privkey.pem;

    # ---- 1. /index and /index.html -> / ----------------------
    location = /index      { return 301 /; }
    location = /index.html { return 301 /; }

    # ---- 2. /about.html -> /about ----------------------------
    # $request_uri is the ORIGINAL request, so the internal
    # try_files rewrite below will not re-trigger this.
    if ($request_uri ~ ^/(.*)\.html(\?|$)) {
        return 301 /$1;
    }

    # ---- 3. strip trailing slash -----------------------------
    rewrite ^/(.*)/$ /$1 permanent;

    # ---- 4. /about -> about.html (internal) ------------------
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- 5. real 404s ----------------------------------------
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- 6. caching ------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # hashed assets: base.a3f9c1.css
    location ~* \.[0-9a-f]{8}\.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(webp|png|jpe?g|gif|svg|ico|mp4|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- 7. compression --------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml;

    # ---- 8. hardening ----------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.          { deny all; }
    location ~ \.(mjs|json|md)$ { deny all; }
}
